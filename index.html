<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      /* Pequenos ajustes para o visual do mockup */
      .navbar-custom-input { max-width: 260px; }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border rounded p-3">
  <div class="container-fluid">
    <a style="color: blueviolet;" class="navbar-brand fw-bold" 
    href="#">EDUHUNTERPLAY</a>
    <button class="navbar-toggler"
     type="button" 
     data-bs-toggle="collapse" 
     data-bs-target="#navbarSupportedContent" 
     aria-controls="navbarSupportedContent" 
     aria-expanded="false" 
     aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" 
        id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Fale Conosco</a>
        </li>
      </ul>
      <form class="d-flex align-items-center" role="search">
        <input class="form-control me-2 navbar-custom-input" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success rounded" type="submit">Search</button>
        <button id="theme-toggle" class="btn btn-outline-secondary ms-2" type="button" aria-pressed="false">Dark</button>
      </form>
    </div>
  </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  (function(){
    const storageKey = 'theme';
    const toggle = document.getElementById('theme-toggle');
    const navbar = document.querySelector('.navbar');
    function applyTheme(theme){
      const isDark = theme === 'dark';
      document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
      if(navbar){
        if(isDark){
          navbar.classList.remove('navbar-light','bg-white');
          navbar.classList.add('navbar-dark','bg-dark');
        } else {
          navbar.classList.remove('navbar-dark','bg-dark');
          navbar.classList.add('navbar-light','bg-white');
        }
      }
      if(toggle){
        toggle.textContent = isDark ? 'Light' : 'Dark';
        toggle.classList.toggle('btn-secondary', isDark);
        toggle.classList.toggle('btn-outline-secondary', !isDark);
        toggle.setAttribute('aria-pressed', isDark.toString());
      }
    }

    const saved = localStorage.getItem(storageKey) || 'light';
    applyTheme(saved);

    if(toggle){
      toggle.addEventListener('click', function(e){
        e.preventDefault();
        const current = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem(storageKey, next);
        applyTheme(next);
      });
    }
  })();
</script>

    <h2>Olá Treinadores!

    </h2>
</body>

</html>
