<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduHunterPlay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
        }

        .navbar-custom-input {
            max-width: 260px;
        }

        .theme-toggle-icon {
            font-size: 1.1rem;
            line-height: 1;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border rounded p-3 shadow-sm">
        <div class="container-fluid">
            <a style="color: blueviolet;" class="navbar-brand fw-bold" href="#">EDUHUNTERPLAY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Fale Conosco</a>
                    </li>
                </ul>
                <form class="d-flex align-items-center" role="search">
                    <input class="form-control me-2 navbar-custom-input" type="search" placeholder="Search"
                        aria-label="Search">
                    <button class="btn btn-outline-success rounded" type="submit">Search</button>
                    <button id="theme-toggle" class="btn btn-outline-secondary ms-2" type="button"
                        aria-pressed="false" aria-label="Alternar tema">
                        <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 style="color: coral;">Funcionando</h1>
        <h2 class="mt-3">Olá Treinadores!</h2>
        <p class="lead">Aula de Bootstrap. Tudo corrigido.</p>
    </main>

    <script>
        (function () {
            const storageKey = 'theme';
            const toggle = document.getElementById('theme-toggle');
            const navbar = document.querySelector('.navbar');

            function applyTheme(theme) {
                const isDark = theme === 'dark';
                document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');

                if (navbar) {
                    if (isDark) {
                        navbar.classList.remove('navbar-light', 'bg-white');
                        navbar.classList.add('navbar-dark', 'bg-dark');
                    } else {
                        navbar.classList.remove('navbar-dark', 'bg-dark');
                        navbar.classList.add('navbar-light', 'bg-white');
                    }
                }

                if (toggle) {
                    const icon = toggle.querySelector('.theme-toggle-icon');
                    if (icon) {
                        icon.textContent = isDark ? '🌙' : '☀️';
                    }
                    toggle.classList.toggle('btn-secondary', isDark);
                    toggle.classList.toggle('btn-outline-secondary', !isDark);
                    toggle.setAttribute('aria-pressed', String(isDark));
                }
            }

            const saved = localStorage.getItem(storageKey) || 'light';
            applyTheme(saved);

            if (toggle) {
                toggle.addEventListener('click', function (event) {
                    event.preventDefault();
                    const current = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
                    const next = current === 'dark' ? 'light' : 'dark';
                    localStorage.setItem(storageKey, next);
                    applyTheme(next);
                });
            }
        })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
